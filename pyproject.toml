[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-ai-assistant"
version = "0.1.0"
description = "Korean voice-controlled desktop AI assistant powered by Claude CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5.0",
    "psutil>=5.9.0",
    "SpeechRecognition>=3.10.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "edge-tts>=6.1.9",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.23.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.2",
    "playwright>=1.40.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8.2",
    "requests>=2.31.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
jarvis-ai = "jarvis_ai.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis_ai = ["core/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
